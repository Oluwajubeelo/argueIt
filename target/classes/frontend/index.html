<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>argueIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="landing-page">
        <div class="brand-title">argueIt</div>

        <div class="auth-container">
            <input type="text" id="create-username" class="auth-input" placeholder="Username">
            <input type="password" id="create-password" class="auth-input" placeholder="Password (Optional)">
            <button id="btn-create" class="btn-create">Create New Room</button>

            <div class="divider">- OR -</div>
            <input type="text" id="join-username" class="auth-input" placeholder="Username">
            <input type="text" id="join-roomcode" class="auth-input" placeholder="Enter code">
            <input type="password" id="join-password" class="auth-input" placeholder="Password (If Required)">
            <button id="btn-join" class="btn-join">Join Room</button>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <div class="left-panel">
            <header>
                <div class="room-info">
                    Room :<span id="display-room-code">---</span>
                    <button class="copy-btn" id="copy-room-btn">Copy</button>
                    <button class="toggle-chat-btn" id="toggle-chat-btn">Toggle Chat</button>
                    <button class="toggle-chat-btn" id="theme-toggle-btn" style="background: #4b5563;">☀️ Light Mode</button>
                </div>
                <h1>argueIt</h1>
            </header>

            <main id="tier-board">
                <div class="tier-row" data-tier-id="S">
                    <div class="tier-label tier-s" contenteditable="true" spellcheck="false">S</div>
                    <div class="tier-dropzone"></div>
                </div>

                <div class="tier-row" data-tier-id="A">
                    <div class="tier-label tier-a" contenteditable="true" spellcheck="false">A</div>
                    <div class="tier-dropzone"></div>
                </div>

                <div class="tier-row" data-tier-id="B">
                    <div class="tier-label tier-b" contenteditable="true" spellcheck="false">B</div>
                    <div class="tier-dropzone"></div>
                </div>

                <div class="tier-row" data-tier-id="C">
                    <div class="tier-label tier-c" contenteditable="true" spellcheck="false">C</div>
                    <div class="tier-dropzone"></div>
                </div>

                <div class="tier-row" data-tier-id="D">
                    <div class="tier-label tier-d" contenteditable="true" spellcheck="false">D</div>
                    <div class="tier-dropzone"></div>
                </div>
            </main>

            <div class="controls">
                <input type="text" id="image-url-input" placeholder="Paste an image URL here ...">
                <button id="add-image-btn">Add Image</button>
                <button id="clear-board-btn" style="background-color: #ff4444; margin-left: auto;">Clear All</button>
                <div style="flex-basis: 100%; height: 0; margin: 0;"></div>
                <input type="text" id="image-search-input" placeholder="Search images(e.g characters, animals)..." style="flex: 2;">
                <button id="search-image-btn" style="background-color: #3b82f6;">Search API</button>
            </div>

            <div id="search-results-container" style="display: none; flex-wrap:wrap; gap: 10px; background-color: #1e1e1e; padding: 15px; border-radius: 8px; border: 2px dashed #555;"></div>

            <div id="trash-can" class="tier-dropzone" data-tier-id="trash">
                🗑️ Drag Image Here to Delete
            </div>

            <section id="image-pool" class="tier-dropzone" data-tier-id="pool">
            </section>
        </div>

        <div class="right-panel">
            <div class="chat-header">
                <h2>Room Chat</h2>
                <button class="call-btn" id="call-btn" title="Join Voice Call">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                </button>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="reply-context-area" id="reply-context-area">
                <div>Replying to <span id="reply-target-name" style="font-weight: bold; color: #10b981;"></span>: <span id="reply-target-text" style="opacity: 0.8; margin-left: 5px;"></span></div>
                <button class="close-btn" id="cancel-reply-btn">✕</button>
            </div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chat-input" placeholder="Type a message...">
                <button class="chat-send-btn" id="chat-send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
